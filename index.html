<style>
    :root {
        --bg: #030305;
        --surface: #0a0a0f;
        --surface-light: #12121d;
        --primary: #d4af37; /* Gold Gradient Theme */
        --primary-glow: rgba(212, 175, 55, 0.3);
        --accent: #6366f1; /* Indigo accents */
        --text: #ffffff;
        --text-sec: #8e8e9a;
        --border: rgba(255, 255, 255, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
        background-color: var(--bg);
        background-image: 
            radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
            radial-gradient(circle at 100% 100%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
        color: var(--text);
        font-family: 'Outfit', sans-serif;
        height: 100vh;
        overflow: hidden;
    }

    .wrapper { display: flex; height: 100vh; flex-direction: column; }
    .main { flex: 1; overflow-y: auto; padding-bottom: 100px; scroll-behavior: smooth; }

    /* --- PREMIUM HEADER --- */
    header {
        position: sticky; top: 0; z-index: 100;
        background: rgba(3, 3, 5, 0.8);
        backdrop-filter: blur(15px);
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 1.5px; }
    .brand span { color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }
    
    .profile-mini { width: 35px; height: 35px; border-radius: 10px; background: var(--surface-light); border: 1px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--primary); }

    /* --- STATS DASHBOARD --- */
    .stats-container { padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 16px 10px; border-radius: 20px; text-align: center;
        transition: 0.3s;
    }
    .stat-card h3 { font-family: 'Rajdhani', sans-serif; font-size: 26px; color: #fff; margin-bottom: 2px; }
    .stat-card p { font-size: 10px; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1px; }

    /* --- GRID SYSTEM (Responsive) --- */
    .vault-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
        gap: 16px; padding: 10px 20px 30px;
    }
    
    /* PC Optimization */
    @media (min-width: 768px) {
        .vault-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
        .main { padding: 0 10%; padding-bottom: 100px; }
    }

    .f-card {
        background: linear-gradient(145deg, #0d0d12, #07070a);
        border: 1px solid var(--border);
        border-radius: 24px; padding: 24px;
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative; cursor: pointer;
    }
    .f-card:hover { 
        border-color: var(--primary); 
        transform: translateY(-8px); 
        box-shadow: 0 15px 35px -10px rgba(212, 175, 55, 0.15);
    }
    .f-card i { 
        font-size: 28px; color: var(--primary); 
        background: rgba(212, 175, 55, 0.05);
        width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
        border-radius: 18px; border: 1px solid rgba(212, 175, 55, 0.1);
        transition: 0.3s;
    }
    .f-card:hover i { background: var(--primary); color: #000; transform: rotate(-5deg); }
    .f-card h4 { font-size: 15px; font-weight: 600; text-align: center; color: #eee; }
    .f-card .count-tag { font-size: 10px; font-weight: 700; color: var(--text-sec); background: rgba(255,255,255,0.03); padding: 5px 12px; border-radius: 30px; border: 1px solid var(--border); }

    /* --- FILE VIEW PAGE --- */
    #files { display: none; padding: 20px; animation: slideUp 0.4s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .back-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 18px; border-radius: 12px; background: var(--surface-light);
        color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 25px;
    }
    .folder-header { margin-bottom: 25px; border-left: 4px solid var(--primary); padding-left: 15px; }
    .folder-header h2 { font-family: 'Rajdhani', sans-serif; font-size: 24px; text-transform: uppercase; color: #fff; }

    .file-item {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 18px; border-radius: 18px; margin-bottom: 12px;
        display: flex; justify-content: space-between; align-items: center;
        transition: 0.2s; cursor: pointer;
    }
    .file-item:hover { background: var(--surface-light); border-color: var(--primary); transform: scale(1.02); }
    .file-name { display: flex; align-items: center; gap: 15px; font-size: 14px; font-weight: 500; color: #ddd; }
    .file-name i { color: var(--primary); font-size: 18px; }

    /* --- BOTTOM NAVIGATION --- */
    .nav-bar {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        width: 90%; max-width: 400px;
        background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.08); border-radius: 25px;
        display: flex; justify-content: space-around; padding: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000;
    }
    .nav-item { color: var(--text-sec); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; text-decoration: none; transition: 0.3s; }
    .nav-item.active { color: var(--primary); }
    .nav-item i { font-size: 20px; }

    /* --- SPLASH SCREEN --- */
    #splash {
        position: fixed; inset: 0; background: #000; z-index: 10000;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .logo-anim { width: 70px; height: 70px; border: 3px solid transparent; border-top-color: var(--primary); border-bottom-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
    @keyframes spin { to { transform: rotate(360deg); } }

</style>

const categoryIcons = {
    "Bihar SI": "fa-user-tie",
    "RRB Technician": "fa-train-subway",
    "SSC ": "fa-shield-halved",
    "Delhi Police": "fa-building-shield",
    "IB Security": "fa-user-secret",
    "General": "fa-folder-open"
};

// --- LOGIC ---
let groupedData = {};

function processFiles() {
    fileData.forEach(file => {
        let folder = "General Tests";
        if(file.includes("Bihar SI")) folder = "Bihar SI 2025";
        else if(file.includes("RRB Technician")) folder = "RRB Technician";
        else if(file.includes("SSC GD")) folder = "SSC GD 2026";
        else if(file.includes("Delhi Police")) folder = "Delhi Police";
        else if(file.includes("IB Security")) folder = "IB Security Asst";

        if(!groupedData[folder]) groupedData[folder] = [];
        groupedData[folder].push(file);
    });
}

function renderGrid() {
    const grid = document.getElementById('category-grid');
    grid.innerHTML = '';
    let total = 0;

    Object.keys(groupedData).sort().forEach(cat => {
        const count = groupedData[cat].length;
        total += count;
        
        // Find icon
        let iconClass = "fa-folder-open";
        for(let key in categoryIcons) {
            if(cat.includes(key)) iconClass = categoryIcons[key];
        }

        grid.innerHTML += `
            <div class="f-card" onclick="openFolder('${cat}')">
                <i class="fas ${iconClass}"></i>
                <h4>${cat}</h4>
                <div class="count-tag">${count} TESTS</div>
            </div>
        `;
    });
    document.getElementById('stat-tests').innerText = total;
}

function openFolder(folderName) {
    document.getElementById('dash-view').style.display = 'none';
    document.getElementById('files').style.display = 'block';
    document.getElementById('current-folder-name').innerText = folderName;
    
    const container = document.getElementById('file-list-container');
    container.innerHTML = '';

    groupedData[folderName].forEach(file => {
        const displayName = file.replace('.html', '');
        container.innerHTML += `
            <div class="file-item" onclick="window.open('${file}', '_blank')">
                <div class="file-name">
                    <i class="far fa-file-alt"></i>
                    <span>${displayName}</span>
                </div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #444;"></i>
            </div>
        `;
    });
    window.scrollTo(0,0);
}

function showDashboard() {
    document.getElementById('files').style.display = 'none';
    document.getElementById('dash-view').style.display = 'block';
}

// Initializer
window.onload = () => {
    processFiles();
    renderGrid();
    setTimeout(() => {
        const splash = document.getElementById('splash');
        splash.style.transition = '0.5s';
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 500);
    }, 2000);
};
</script>
